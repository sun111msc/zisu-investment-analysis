site_name: 紫苏投资分析
site_description: 以产业链物理瓶颈为锚点的股票分析方法论 · 15 篇方法论文档 · 25 道纪律闸门
site_url: https://sun111msc.github.io/zisu-investment-analysis/
repo_url: https://github.com/sun111msc/zisu-investment-analysis
repo_name: sun111msc/zisu-investment-analysis
edit_uri: edit/main/docs/
copyright: Apache-2.0 · 本项目为研究与工程示范用途，不构成任何投资建议

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

