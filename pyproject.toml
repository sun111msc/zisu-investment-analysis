[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zisu-investment-analysis"
version = "1.0.0"
description = "紫苏投资分析 — 以类型化数值契约与失败关闭闸门约束 LLM 在股票深度分析中的幻觉。An agentic equity-research framework with typed value contracts and fail-closed gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Zisu Investment Analysis Contributors" }]
keywords = [
    "agent",
    "llm",
    "ai-agent",
    "equity-research",
    "financial-analysis",
    "guardrails",
    "evaluation",
    "a-share",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
zisu = "zisu.cli:main"

[project.urls]
Homepage = "https://github.com/sun111msc/zisu-investment-analysis"
Documentation = "https://github.com/sun111msc/zisu-investment-analysis/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/zisu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/zisu"]
