name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: lint · test · eval (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 静态检查
        run: ruff check src tests evals

      - name: 单元与集成测试
        run: pytest --cov=zisu --cov-report=term-missing

      - name: 评测（劣化即失败）
        run: |
          PYTHONPATH=src python evals/run_eval.py --strict --json --out evals/reports/ci.md

      - name: 治理一致性检查
        run: |
          PYTHONPATH=src python - <<'PY'
          import re, sys
          from pathlib import Path
          from zisu.gates import ALL_RULES

          # 文档里的闸门编号必须与代码一致，防止文档漂移
          text = Path("docs/engineering/gate-catalog.md").read_text(encoding="utf-8")
          documented = set(re.findall(r"GATE-\d{2}", text))
          implemented = {r[0] for r in ALL_RULES}
          missing = implemented - documented
          if missing:
              print(f"以下闸门已在代码实现但未写入 docs/engineering/gate-catalog.md：{sorted(missing)}")
              sys.exit(1)
          print(f"闸门文档一致性通过：{len(implemented)} 道")
          PY

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: evals/reports/
          if-no-files-found: ignore
